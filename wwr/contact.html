<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description" content="A contact page for questions and aski for information.">
    <meta name="author" content="Jorge Gabriel Mena Santes">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/rafting-logo.png" alt="White Water Rafting Logo" width="128" height="128">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="contact">
            <h2>White Water Rafting Company</h2>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </div>
        <section class="mapform">
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3169.0832616756725!2d-99.08708887268004!3d19.466096552631825!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d1fbc4648b0ee7%3A0x61382b34e9618369!2sTemplo%20de%20la%20Ciudad%20de%20M%C3%A9xico!5e1!3m2!1ses!2smx!4v1785634187815!5m2!1ses!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form>
                <fieldset>
                    <div class="name-email">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    
                    </div>
                    <div class="name-email">
                        <label for="email">Email</label>
                        <input type="text" id="email" name="email" required>
                    </div>
                    
                    <div class="radios">
                        <legend>Message Purpose</legend>
                        <input type="radio" id="General" name="purpose" required>
                        <label for="General">General Inquiry</label>
                        <input type="radio" id="Reservation" name="purpose" required>
                        <label for="Reservation">Reservation Question</label>
                        <input type="radio" id="Suggestion" name="purpose" required>
                        <label for="Suggestion">Website Suggestion</label>
                    </div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" required></textarea>

                    <div class="suscribe">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Please Suscribe me to the monthly newsletter</label>
                    </div>
                </fieldset>
                <button type="submit">Get in touch!</button>
            </form>
        </section>
        <section>
            <h2>We are here to serve you</h2>
            <div class="employees">
                <figure>
                    <img src="images/employee-1.jpg" alt="Employee 1">
                    <figcaption>Alma Chavez</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-2.jpg" alt="Employee 2">
                    <figcaption>Daniel Sanchez</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-3.jpg" alt="Employee 1">
                    <figcaption>Laura Díaz</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 | White Water Rafting | Jorge Gabriel Mena Santes</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-logo.svg" alt="Facebook Logo" width="100" height="100">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-logo.svg" alt="Instagram Logo" width="100" height="100">
            </a>
            <a href="https://tiktok.com">
                <img src="images/tictok-logo.svg" alt="TikTok Logo" width="100" height="100">
            </a>
        </nav>
    </footer>
</body>
</html>
